<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffd84d">
<title>یارییەکانم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans Arabic',sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
:root{
  --gap: clamp(12px, 3vw, 18px);
  --radius: clamp(20px, 4.5vw, 28px);
}
html,body{height:100%;overflow:hidden;}
body{
  background:linear-gradient(160deg,#0d0d0d 0%,#1a1a1a 100%);
  color:#fff;
}
.app-wrap{
  max-width:540px;margin:0 auto;padding:0 var(--gap) 40px;
  height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
@media(min-width:600px){.app-wrap{max-width:640px;}}

/* HEADER */
.hub-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 0 18px;
}
.hub-title{font-size:clamp(22px,6vw,28px);font-weight:800;color:#fff;}
.hub-sub{font-size:13px;font-weight:700;color:rgba(255,255,255,.4);margin-top:2px;}

/* GRID */
.game-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:var(--gap);
  margin-top:8px;
}
.game-card{
  position:relative;
  border-radius:var(--radius);
  overflow:hidden;
  min-height:clamp(220px,52vw,270px);
  cursor:pointer;
  padding:clamp(18px,4.5vw,24px);
  display:flex;flex-direction:column;justify-content:flex-start;
  transition:transform .2s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.game-card:active{transform:scale(.96);}
.game-card-title{
  font-size:clamp(18px,4.8vw,22px);
  font-weight:800;
  line-height:1.2;
  margin-bottom:8px;
  position:relative;z-index:2;
  text-shadow:0 2px 8px rgba(0,0,0,.5);
}
.game-card-underline{
  width:34px;height:4px;border-radius:4px;
  margin-bottom:auto;
  position:relative;z-index:2;
}
.game-card-art{
  position:absolute;
  inset:0;
  pointer-events:none;
}
.game-card-art img{
  width:100%;height:100%;object-fit:cover;object-position:center;
}
.game-card-art::after{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,.15) 0%, rgba(0,0,0,.35) 55%, rgba(0,0,0,.7) 100%);
}
.game-card-badge{
  position:absolute;top:14px;left:14px;z-index:3;
  padding:5px 12px;border-radius:999px;
  font-size:11px;font-weight:800;
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}
.badge-new{background:#ff3b3b;color:#fff;}
.badge-popular{background:#3b82f6;color:#fff;}
.badge-online{background:#22c55e;color:#fff;}

.empty-note{
  text-align:center;color:rgba(255,255,255,.35);
  font-size:13px;font-weight:700;
  padding:40px 0;
}

/* ══ GAME OVERLAY (iframe) ══ */
.game-overlay{
  position:fixed;inset:0;
  z-index:5000;
  background:#000;
  opacity:0;
  pointer-events:none;
  transform:scale(.97);
  transition:opacity .3s ease, transform .3s cubic-bezier(.34,1.1,.64,1);
}
.game-overlay.active{
  opacity:1;
  pointer-events:auto;
  transform:scale(1);
}
.game-overlay iframe{
  width:100%;height:100%;
  border:none;
  display:block;
  background:#fff;
}

/* دوگمەی هۆڵد بۆ گەڕانەوە — سەرووی iframe */
#gameBackWrap{
  position:fixed;
  bottom:18px;left:18px;
  z-index:5100;
  width:56px;height:56px;
  opacity:0;pointer-events:none;
  transition:opacity .25s ease;
}
.game-overlay.active ~ #gameBackWrap{opacity:1;pointer-events:auto;}
#gameBackBtn{
  position:relative;width:100%;height:100%;border-radius:50%;
  background:rgba(20,20,20,.6);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1.5px solid rgba(255,255,255,.18);
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  transition:transform .15s cubic-bezier(.34,1.56,.64,1);
}
#gameBackBtn:active{transform:scale(.92);}
#gameBackBtn svg{width:24px;height:24px;fill:#fff;opacity:.9;position:relative;z-index:2;}
#gameBackRing{position:absolute;inset:-3px;border-radius:50%;pointer-events:none;}
#gameBackRing svg{width:100%;height:100%;transform:rotate(-90deg);}
#gameBackRing circle{
  fill:none;stroke:#ffd400;stroke-width:3;stroke-linecap:round;
  stroke-dasharray:157;stroke-dashoffset:157;
  transition:stroke-dashoffset linear;
}
#gameBackWrap.holding #gameBackBtn{transform:scale(1.06);}
#gameBackWrap.holding #gameBackRing circle{stroke-dashoffset:0;transition-duration:750ms;}
#gameBackHint{
  position:absolute;bottom:64px;left:50%;
  transform:translateX(-50%) translateY(6px);
  background:rgba(20,20,20,.85);color:#fff;
  font-size:11px;font-weight:800;padding:6px 12px;border-radius:100px;
  white-space:nowrap;opacity:0;
  transition:opacity .2s ease, transform .2s ease;
  pointer-events:none;
}
#gameBackWrap.holding #gameBackHint{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="app-wrap">
  <div class="hub-header">
    <div>
      <div class="hub-title">یارییەکان</div>
      <div class="hub-sub">یاریت هەڵبژێرە و دەست پێبکە</div>
    </div>
  </div>

  <div class="game-grid" id="gameGrid"></div>
  <div class="empty-note hidden" id="emptyNote">هێشتا یاری زیاد نەکراوە</div>
</div>

<!-- یاری کراوە لێرە بار دەبێت -->
<div class="game-overlay" id="gameOverlay">
  <iframe id="gameFrame" src="" allow="autoplay; clipboard-write; vibrate"></iframe>
</div>

<!-- دوگمەی هۆڵد بۆ گەڕانەوە -->
<div id="gameBackWrap">
  <div id="gameBackHint">هۆڵدی بکە بۆ گەڕانەوە</div>
  <div id="gameBackBtn">
    <div id="gameBackRing"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="25"/></svg></div>
    <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11H8.41l3.29 3.29-1.41 1.42L4.83 12l5.46-5.71 1.41 1.42L8.41 11H17v2z"/></svg>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════
   لیستی یارییەکان — بۆ زیادکردنی یاری نوێ:
   ١) فایلەکانی یارییەکە لە فۆڵدەرێکی نوێ دابنێ
   ٢) ئۆبجێکتێکی نوێ زیاد بکە لەم لیستەی خوارەوە
   تەواو! پێویست بە هیچ گۆڕانکاریەکی تر نییە.
   ══════════════════════════════════════════════════ */
const GAMES = [
  {
    id: "sexur",
    title: "سیخوڕ",
    folder: "main/sexur/",
    bg: "linear-gradient(150deg,#2a1a1a,#4a1010)",
    underline: "#ff4d4d",
    thumb: "img/tower.webp",
    badge: "ONLINE"
  },
  {
    id: "tower",
    title: "تاوەر",
    folder: "main/tower/",
    bg: "linear-gradient(150deg,#2a1a1a,#4a1010)",
    underline: "#ff4d4d",
    thumb: "img/sexur.webp",
    badge: "NEW"
  },
  // یاری نوێ لێرە زیاد بکە، بۆ نموونە:
  // {
  //   id: "game2",
  //   title: "ناوی یاریی نوێ",
  //   folder: "games/game2/",
  //   bg: "linear-gradient(150deg,#1a2a1a,#103a10)",
  //   underline: "#4dff88",
  //   thumb: "games/game2/thumb.webp",
  //   badge: "new"
  // },
];

function badgeHtml(badge){
  const b = (badge || "").toLowerCase();
  if(b === "new") return `<div class="game-card-badge badge-new">نوێ</div>`;
  if(b === "popular") return `<div class="game-card-badge badge-popular">بەناوبانگترین</div>`;
  if(b === "online") return `<div class="game-card-badge badge-online">ئۆنڵاین</div>`;
  return "";
}

function renderGames(){
  const grid = document.getElementById('gameGrid');
  const empty = document.getElementById('emptyNote');
  if(GAMES.length === 0){
    grid.innerHTML = "";
    empty.classList.remove('hidden');
    return;
  }
  empty.classList.add('hidden');
  grid.innerHTML = GAMES.map(g => `
    <div class="game-card" style="background:${g.bg}" onclick="openGame('${g.folder}')">
      ${badgeHtml(g.badge)}
      <div class="game-card-title">${g.title}</div>
      <div class="game-card-underline" style="background:${g.underline}"></div>
      ${g.thumb ? `<div class="game-card-art"><img src="${g.thumb}" loading="lazy" onerror="this.parentElement.style.display='none'"></div>` : ''}
    </div>
  `).join('');
}

/* ══ کردنەوە و داخستنی یاری لەناو iframe — بۆ ئەوەی URL هەمیشە دۆمەینی سەرەکی بمێنێتەوە ══ */
const overlay = document.getElementById('gameOverlay');
const frame = document.getElementById('gameFrame');

function openGame(folder){
  if('vibrate' in navigator) navigator.vibrate(10);
  frame.src = folder;
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
  history.pushState({ game: folder }, '', location.pathname);
}

function closeGame(){
  overlay.classList.remove('active');
  document.body.style.overflow = '';
  setTimeout(() => { frame.src = ''; }, 300);
}

/* دوگمەی وێبگەڕی گەڕانەوە (Android/Chrome) یاریەکە دادەخات لە جیاتی دەرچوون لە سایتەکە */
window.addEventListener('popstate', () => {
  if(overlay.classList.contains('active')) closeGame();
});

/* ══ دوگمەی هۆڵد بۆ گەڕانەوە ══ */
const backWrap = document.getElementById('gameBackWrap');
const backBtn = document.getElementById('gameBackBtn');
const HOLD_MS = 750;
let holdTimer = null, holding = false;

function vib(p){ if('vibrate' in navigator) navigator.vibrate(p); }

function startHold(){
  if(holding) return;
  holding = true;
  backWrap.classList.add('holding');
  vib(10);
  holdTimer = setTimeout(() => {
    vib([15,40,20]);
    closeGame();
    if(history.state && history.state.game) history.back();
  }, HOLD_MS);
}
function cancelHold(){
  if(!holding) return;
  holding = false;
  backWrap.classList.remove('holding');
  clearTimeout(holdTimer);
}

backBtn.addEventListener('touchstart', e => { e.preventDefault(); startHold(); }, {passive:false});
backBtn.addEventListener('touchend', cancelHold, {passive:true});
backBtn.addEventListener('touchcancel', cancelHold, {passive:true});
backBtn.addEventListener('mousedown', startHold);
backBtn.addEventListener('mouseup', cancelHold);
backBtn.addEventListener('mouseleave', cancelHold);

renderGames();
</script>
</body>
</html>
